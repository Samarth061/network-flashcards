<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Study Guide</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f3;
    --color-background-tertiary: #eeede8;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5f5e5a;
    --color-text-tertiary: #888780;
    --color-border-tertiary: rgba(0,0,0,0.12);
    --color-border-secondary: rgba(0,0,0,0.22);
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1e1e1c;
      --color-background-secondary: #2a2a28;
      --color-background-tertiary: #333330;
      --color-text-primary: #f0ede8;
      --color-text-secondary: #b4b2a9;
      --color-text-tertiary: #888780;
      --color-border-tertiary: rgba(255,255,255,0.1);
      --color-border-secondary: rgba(255,255,255,0.2);
    }
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-background-tertiary);
    color: var(--color-text-primary);
    min-height: 100vh;
    padding: 3rem 1rem;
  }
  .app { max-width: 740px; margin: 0 auto; }
  .header { margin-bottom: 2.5rem; }
  .title { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--color-text-secondary); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .topic-card {
    display: block;
    text-decoration: none;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem 1.25rem 1rem;
    transition: border-color 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .topic-card:hover {
    border-color: var(--color-border-secondary);
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  .topic-icon { font-size: 24px; margin-bottom: 10px; }
  .topic-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .topic-desc { font-size: 12px; color: var(--color-text-tertiary); line-height: 1.5; }
  .topic-badge {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #E1F5EE;
    color: #0F6E56;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">Network Study Guide</div>
    <div class="subtitle">Select a topic to start studying</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
// To add a new topic:
// 1. Save its HTML to topics/<file>.html
// 2. Add one entry to this array
const topics = [
  {
    name: "OSPF",
    href: "topics/ospf.html",
    icon: "🔁",
    desc: "Link-state routing, areas, LSA types, neighbor states",
    badge: "55 cards"
  },
  {
    name: "Link Layer",
    href: "topics/linklayer.html",
    icon: "🔌",
    desc: "Ethernet, MAC addressing, switches, VLANs, STP, ARP, and Layer 2 fundamentals",
    badge: "58 cards"
  },
  {
    name: "Transport Layer Teaching Guide",
    href: "topics/transportlayerteachingguide.html",
    icon: "🚦",
    desc: "Transport Layer teaching guide — structured lessons covering TCP, UDP, flow control, congestion, and sockets",
    badge: "Study Guide"
  },
  {
    name: "Link Layer Teaching Guide",
    href: "topics/linklayerteachingguide.html",
    icon: "🔗",
    desc: "Link Layer teaching guide — structured lessons covering Ethernet, MAC, switches, VLANs, and Layer 2 concepts",
    badge: "Study Guide"
  },
  {
    name: "Network Teaching Guide",
    href: "topics/networkteachingguide.html",
    icon: "📚",
    desc: "Network Layer teaching guide — structured lessons covering routing, IP, and Layer 3 concepts",
    badge: "Study Guide"
  },
  {
    name: "Network Layer",
    href: "topics/networklayer.html",
    icon: "🗺️",
    desc: "Routing, IP forwarding, ARP, ICMP, fragmentation, TTL, and Layer 3 fundamentals",
    badge: "46 cards"
  },
  {
    name: "IPv6",
    href: "topics/IPv6.html",
    icon: "🌐",
    desc: "IPv6 addressing, header format, NDP, transition mechanisms, prefix notation",
    badge: "63 cards"
  },
  {
    name: "Python Automation",
    href: "networkautomation/index.html",
    icon: "🐍",
    desc: "19-module learning track, 20 LiveCode problems, 38 networking flashcards, 2 full mock interviews",
    badge: "NDE Interview Prep"
  },
];

const grid = document.getElementById('grid');
grid.innerHTML = topics.map(t => `
  <a class="topic-card" href="${t.href}">
    <div class="topic-icon">${t.icon}</div>
    <div class="topic-name">${t.name}</div>
    <div class="topic-desc">${t.desc}</div>
    <span class="topic-badge">${t.badge}</span>
  </a>
`).join('');
</script>
</body>
</html>
